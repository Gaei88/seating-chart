<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大家一起排排座</title>
<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
}

/* ============ 顶部 ============ */
header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;padding:18px 28px 14px;
  box-shadow:0 2px 10px rgba(37,99,235,.25);
}
header h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
/* 标题点击编辑 */
#mainTitle{cursor:text;outline:none;border-radius:6px;padding:0 4px;border-bottom:2px dashed transparent;transition:all .15s;}
#mainTitle:hover{border-bottom-color:#94a3b8;background:rgba(0,0,0,.04);}
#mainTitle:focus{border-bottom-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.15);}
header h1 .sub{font-size:13px;font-weight:400;opacity:.85;margin-left:4px;}
.stats{margin-top:6px;font-size:13px;opacity:.92;}
.stats b{font-size:16px;margin:0 2px;}

/* ============ 工具栏 ============ */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.toolbar button{
  border:1.5px solid var(--line);background:#fff;color:var(--text);
  padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer;
  transition:all .15s;font-family:inherit;font-weight:500;
}
.toolbar button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 6px rgba(59,130,246,.15);transform:translateY(-1px);}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px;}
.toolbar .hint{font-size:12px;color:var(--muted);margin-left:auto;}
.zoom-box{
  display:flex;align-items:center;gap:4px;
  background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;padding:3px 6px;
}
.zoom-box button{
  border:none;background:none;padding:2px 7px;font-size:15px;color:#475569;
  cursor:pointer;border-radius:6px;line-height:1;font-weight:700;
}
.zoom-box button:hover{background:#e2e8f0;color:var(--accent);box-shadow:none;transform:none;}
.zoom-box input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer;}
.zoom-box .zv{font-size:12px;font-weight:600;color:#475569;min-width:38px;text-align:center;}
.zoom-box .zlabel{font-size:12px;font-weight:600;color:#475569;padding-right:2px;}

/* ============ 主布局 ============ */
.layout{flex:1;display:flex;min-height:0;}

/* ============ 左侧人员名单 ============ */
#sidebar{
  width:288px;flex:0 0 288px;height:100%;overflow-y:auto;
  background:var(--card);border-right:1px solid var(--line);
  padding:14px 0 12px;display:flex;flex-direction:column;
}
.sb-task{
  display:flex;align-items:center;gap:6px;
  padding:0 12px 12px;border-bottom:1px solid var(--line);
}
.sb-task select{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
  padding:7px 8px;font-size:13px;font-family:inherit;background:#fafbfe;outline:none;color:var(--text);cursor:pointer;
}
.sb-task select:focus{border-color:var(--accent);background:#fff;}
.sb-task button{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:6px 8px;font-size:13px;cursor:pointer;line-height:1;color:#475569;font-family:inherit;
}
.sb-task button:hover{border-color:var(--accent);color:var(--accent);}
.sb-head{display:flex;align-items:center;gap:8px;padding:0 16px 10px;border-bottom:1px solid var(--line);}
.sb-title{font-size:16px;font-weight:700;}
.sb-count{margin-left:auto;font-size:12px;background:var(--accent);color:#fff;padding:2px 9px;border-radius:99px;font-weight:600;}
.sb-search{padding:10px 12px 2px;}
.sb-search input{
  width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:7px 11px;font-size:13px;font-family:inherit;outline:none;background:#fafbfe;
}
.sb-search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12);}
#sbList{flex:1;overflow-y:auto;padding:4px 10px 6px;}
.sb-group{margin-top:8px;}
.sb-ghead{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;border-radius:8px;background:#f3f5fa;
}
.sb-gname{font-size:13px;font-weight:700;color:#374151;}
.sb-gcount{font-size:11px;color:var(--muted);}
.sb-gadd{
  margin-left:auto;border:none;background:none;cursor:pointer;
  font-size:13px;color:var(--muted);padding:2px 6px;border-radius:6px;line-height:1;
}
.sb-gadd:hover{background:#e0e7ff;color:var(--accent);}
.sb-person{
  display:flex;align-items:center;gap:6px;
  padding:4px 6px 4px 10px;border-radius:8px;margin-top:2px;
  font-size:13px;color:#374151;cursor:default;
}
.sb-person:hover{background:#f3f4f6;}
.sb-person .sb-pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-dot{flex:none;width:10px;height:10px;border-radius:50%;border:1px solid #e2e8f0;}
.sb-pdel{
  border:none;background:none;cursor:pointer;color:#cbd5e1;
  font-size:12px;padding:2px 5px;border-radius:6px;line-height:1;
  visibility:hidden;
}
.sb-person:hover .sb-pdel{visibility:visible;}
.sb-pdel:hover{background:#fee2e2;color:#dc2626;}
.sb-gempty{font-size:11px;color:#9ca3af;padding:4px 0 4px 10px;font-style:italic;}
.sb-badge{
  flex:none;font-size:11px;line-height:1.15;padding:2px 6px;border-radius:6px;
  font-weight:600;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;
}
.sb-gender{background:#94a3b8;color:#fff;}
.sb-gender.g-m{background:#3b82f6;color:#fff;}
.sb-gender.g-f{background:#ec4899;color:#fff;}
.sb-rank{background:#eef2f7;color:#475569;border:1px solid #e2e8f0;}
.sb-foot{padding:10px 12px 0;border-top:1px solid var(--line);}
.sb-foot button{
  width:100%;border:1.5px dashed #c7d2fe;background:#eef2ff;color:#4338ca;
  padding:9px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;
  transition:all .15s;
}
.sb-foot button:hover{background:#e0e7ff;border-color:var(--accent);transform:translateY(-1px);}

/* ============ 桌区 ============ */
#grid{
  flex:1;min-width:0;overflow-y:auto;
  display:flex;flex-wrap:wrap;gap:22px;
  padding:26px 28px;justify-content:flex-start;align-items:flex-start;
  align-content:flex-start;
}
/* 每行固定 2 桌（卡片保持 500px，窗口放不下时自动降为每行 1 桌居中） */
#grid.fixed2{justify-content:center;}
#grid.fixed2 .table-card{flex:0 0 500px;}
.table-card{
  position:relative;width:500px;min-height:470px;
  background:var(--card);border-radius:18px;
  box-shadow:0 4px 16px rgba(15,23,42,.07);
  border:1px solid var(--line);
  overflow:hidden;
  --accent:#3b82f6;
}
.table-head{
  display:flex;align-items:center;gap:8px;
  padding:13px 16px;background:#fafbfe;border-bottom:1px solid var(--line);
}
.table-name{font-size:17px;font-weight:700;color:var(--text);}
.table-name::before{
  content:"";display:inline-block;width:10px;height:10px;border-radius:3px;
  background:var(--accent);margin-right:8px;vertical-align:1px;
}
.table-count{
  font-size:12px;background:var(--accent);color:#fff;
  padding:2px 9px;border-radius:99px;font-weight:600;
}
.del-table{
  margin-left:auto;border:none;background:none;color:var(--muted);
  font-size:15px;cursor:pointer;padding:4px 6px;border-radius:8px;line-height:1;
}
.del-table:hover{background:#fee2e2;color:#dc2626;}
.table-body{position:relative;height:400px;}
.round-table{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  width:226px;height:226px;border-radius:50%;
  border:3px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,#fff);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--accent);box-shadow:inset 0 0 0 8px color-mix(in srgb,var(--accent) 6%,#fff);
}
.round-table .rt-title{font-size:26px;font-weight:800;letter-spacing:1px;}
.round-table .rt-sub{font-size:11px;margin-top:4px;opacity:.75;}
.seat{
  position:absolute;transform:translate(-50%,-50%);
  min-width:76px;width:max-content;max-width:160px;min-height:40px;padding:5px 8px;
  background:#fff;border:1.5px solid #d3d9e2;border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  cursor:grab;user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
  font-size:var(--name-size,13px);font-weight:600;color:#374151;
  line-height:1.15;
  transition:transform .12s,box-shadow .12s,border-color .12s;
  z-index:2;
}
.seat-name{display:block;overflow-wrap:anywhere;}
.seat:hover{border-color:var(--accent);transform:translate(-50%,-50%) scale(1.07);box-shadow:0 4px 10px rgba(0,0,0,.13);z-index:6;}
.seat:active{cursor:grabbing;}
.seat.dragging{opacity:.35;z-index:8;}
.seat.drag-over{border-color:var(--accent);background:#eff6ff;box-shadow:0 0 0 3px rgba(59,130,246,.28);transform:translate(-50%,-50%) scale(1.05);z-index:7;}
.empty-table{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9ca3af;font-size:14px;gap:6px;pointer-events:none;
}
.empty-table .big{font-size:30px;}

/* ============ 右键菜单 ============ */
.menu{
  position:fixed;z-index:300;background:#fff;border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:160px;
  border:1px solid var(--line);
}
.menu-item{
  padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.menu-item:hover{background:#f3f4f6;}
.menu-item.danger{color:#dc2626;}
.menu-item.danger:hover{background:#fef2f2;}

/* ============ 姓名框填充颜色（色板弹窗） ============ */
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 2px;}
.color-swatch{
  aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;
  transition:transform .1s,box-shadow .1s;position:relative;
}
.color-swatch:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(0,0,0,.2);}
.color-swatch.on{border-color:#0f172a;box-shadow:0 0 0 2px #fff inset;}
.color-swatch.none{
  background:#fff;border:2px dashed #cbd5e1;color:#94a3b8;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.color-custom{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.color-custom label{font-size:13px;color:#475569;}
.color-custom input[type=color]{
  width:46px;height:30px;border:1px solid var(--line);border-radius:8px;
  padding:2px;background:#fff;cursor:pointer;
}
.color-tip{font-size:11.5px;color:#94a3b8;margin-top:8px;}

/* ============ 弹窗 ============ */
#modalOverlay{
  position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:400;
  display:flex;align-items:center;justify-content:center;
}
#modal{
  background:#fff;border-radius:16px;padding:22px;width:380px;max-width:92vw;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
#modal h3{font-size:17px;margin-bottom:14px;}
#modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px;}
#modal textarea,#modal input[type=text]{
  width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:14px;font-family:inherit;outline:none;
}
#modal textarea:focus,#modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15);}
#modal select{
  width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:14px;background:#fff;font-family:inherit;
}
#modal input[type=file]{
  width:100%;border:1.5px dashed #cbd5e1;border-radius:10px;
  padding:8px 10px;font-size:13px;background:#fafbfe;cursor:pointer;
}
#modal input[type=file]::-webkit-file-upload-button{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 12px;margin-right:10px;font-size:13px;cursor:pointer;font-family:inherit;
}
#modal .fmt{font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.8;margin-top:6px;}
#modal .fmt b{color:#374151;}
.modal-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.modal-btns button{
  padding:8px 18px;border-radius:10px;font-size:14px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;font-family:inherit;
}
.modal-btns .ok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.modal-btns .ok:hover{opacity:.9;}
.m-msg{font-size:14px;color:#374151;line-height:1.7;}
.m-error{color:#dc2626;font-size:12px;margin-top:8px;font-weight:600;}

/* ============ 打印预览面板 ============ */
#printPreview{
  position:fixed;inset:0;z-index:500;background:rgba(15,23,42,.55);
  display:flex;flex-direction:column;
}
#printPreview.hidden{display:none;}
.pp-head{
  background:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.pp-title{font-size:16px;font-weight:800;color:var(--text);}
.pp-head label{font-size:13px;color:var(--muted);}
.pp-head select{
  padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;
  font-size:13px;background:#fff;font-family:inherit;
}
.pp-head input[type=range]{width:130px;accent-color:var(--accent);cursor:pointer;}
.pp-zoom-val{font-size:13px;font-weight:700;color:#475569;min-width:44px;text-align:center;}
.pp-actions{margin-left:auto;display:flex;gap:8px;}
.pp-actions button{
  padding:8px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;font-family:inherit;
}
.pp-actions .pp-do{background:var(--accent);border-color:var(--accent);color:#fff;}
.pp-actions .pp-do:hover{opacity:.9;}
.pp-pages{
  flex:1;overflow:auto;padding:22px;display:flex;flex-wrap:wrap;gap:20px;
  align-content:flex-start;justify-content:center;
}
.pp-page{
  background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.25);border-radius:6px;
  width:700px;min-height:990px;padding:18px;box-sizing:border-box;
  display:flex;flex-direction:column;
}
.pp-page.landscape{width:990px;min-height:700px;}
.pp-page .pp-inner{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:12px;}
.pp-page .pp-inner .table-card{flex:none;width:500px;}
.pp-page .pp-pg-title{flex:none;font-size:20px;font-weight:800;text-align:center;color:#1f2937;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid #e5e7eb;}
.pp-page-num{text-align:center;font-size:12px;color:#94a3b8;margin-top:10px;flex:none;}

.hidden{display:none !important;}

/* ============ 打印 ============ */
@media print{
  body{background:#fff;padding:0;}
  header{background:#fff !important;color:#000;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  header h1{color:#000;}
  header h1 .sub,.stats{color:#555;}
  header h1 .sub{display:none !important;}
  #mainTitle{border-bottom-color:transparent !important;background:none !important;box-shadow:none !important;}
  .toolbar,.menu,#modalOverlay,#printPreview,.del-table,.empty-table .big{display:none !important;}
  .layout{display:block;overflow:visible;}
  #sidebar{display:none !important;}
  #grid{
    overflow:visible;height:auto;flex:none;zoom:1 !important;
    display:flex !important;flex-wrap:wrap;justify-content:center;align-content:flex-start;
    gap:10px;padding:8px;
  }
  .table-card{
    box-shadow:none;border:1px solid #bbb;break-inside:avoid;min-height:440px;
    width:500px;margin:0;flex:none !important;
    zoom:var(--print-zoom,1);
  }
  .seat{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* 每页 N 桌分页（pp-auto = 不限桌数，自动缩放适配，由浏览器自动分页） */
  .pp-auto .table-card{break-inside:avoid;}
  .pp-1 .table-card{break-after:page;}
  .pp-1 .table-card:last-child{break-after:auto;}
  .pp-2 .table-card:nth-child(2n){break-after:page;}
  .pp-2 .table-card:last-child{break-after:auto;}
  .pp-3 .table-card:nth-child(3n){break-after:page;}
  .pp-3 .table-card:last-child{break-after:auto;}
  .pp-4 .table-card:nth-child(4n){break-after:page;}
  .pp-4 .table-card:last-child{break-after:auto;}
  .pp-6 .table-card:nth-child(6n){break-after:page;}
  .pp-6 .table-card:last-child{break-after:auto;}
}
/* ============ 分享提示 ============ */
.toast{
  position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);
  background:rgba(17,24,39,.92);color:#fff;padding:11px 20px;border-radius:10px;
  font-size:14px;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<header>
  <h1>🍽 <span id="mainTitle" contenteditable="true" spellcheck="false" title="点击编辑标题">大家一起排排座</span> <span class="sub">互动编辑版 · 数据自动保存</span></h1>
  <div class="stats">任务：<b id="statTaskName">大家一起排排座</b> &nbsp;|&nbsp; 共 <b id="statPeople">0</b> 人 · <b id="statTables">0</b> 桌 &nbsp;|&nbsp; 拖拽人名可换位 · 点击人名弹菜单 · 改动自动保存</div>
</header>

<div class="toolbar">
  <button id="btnNewTask">📁 新建任务</button>
  <button id="btnAddPerson">➕ 添加人员</button>
  <button id="btnImport">📥 导入名单</button>
  <button id="btnAddTable">🪑 添加一桌</button>
  <div class="sep"></div>
  <div class="zoom-box" title="缩放座位图">
    <button id="btnZoomOut">−</button>
    <input type="range" id="zoomRange" min="60" max="150" step="5" value="100">
    <button id="btnZoomIn">＋</button>
    <span class="zv" id="zoomVal">100%</span>
  </div>
  <div class="sep"></div>
  <div class="zoom-box" title="调整姓名字号">
    <span class="zlabel">字号</span>
    <button id="btnFontDown" title="缩小姓名">A−</button>
    <input type="range" id="fontRange" min="11" max="28" step="1" value="13">
    <button id="btnFontUp" title="放大姓名">A＋</button>
    <span class="zv" id="fontVal">13</span>
  </div>
  <div class="sep"></div>
  <button id="btnExport">📄 导出表格</button>
  <button id="btnShare">🔗 分享</button>
  <button id="btnPrint">🖨 打印</button>
  <div class="sep"></div>
  <button id="btnReset">↺ 重置名单</button>
  <span class="hint">💡 拖到人名上 = 互换 &nbsp;·&nbsp; 拖到桌面空白 = 移到桌尾</span>
</div>

<div class="layout">
  <aside id="sidebar">
    <div class="sb-task">
      <select id="taskSel" title="切换任务"></select>
      <button id="btnTaskRename" title="重命名任务">✏️</button>
      <button id="btnTaskDel" title="删除任务">🗑</button>
    </div>
    <div class="sb-head">
      <span class="sb-title">👥 人员名单</span>
      <span class="sb-count" id="sbCount">0</span>
    </div>
    <div class="sb-search"><input id="sbSearch" type="text" placeholder="🔍 搜索姓名…" autocomplete="off"></div>
    <div id="sbList"></div>
    <div class="sb-foot"><button id="btnSbAdd">➕ 添加人员</button></div>
  </aside>
  <main id="grid"></main>
</div>

<div id="menu" class="menu hidden"></div>
<div id="modalOverlay" class="hidden"><div id="modal"></div></div>

<!-- 打印预览面板 -->
<div id="printPreview" class="hidden">
  <div class="pp-head">
    <span class="pp-title">🖨 打印预览</span>
    <label>每页桌数</label>
    <select id="ppPerPage">
      <option value="0">自动（不限桌数 · 自适应缩放）</option>
      <option value="1">1 桌/页</option>
      <option value="2">2 桌/页</option>
      <option value="3">3 桌/页</option>
      <option value="4">4 桌/页</option>
      <option value="6">6 桌/页</option>
    </select>
    <label>缩放</label>
    <input type="range" id="ppZoom" min="40" max="150" step="5" value="100">
    <span class="pp-zoom-val" id="ppZoomVal">100%</span>
    <label>纸张方向</label>
    <select id="ppOrient">
      <option value="portrait">📄 纵向</option>
      <option value="landscape">📃 横向</option>
    </select>
    <div class="pp-actions">
      <button id="ppDoPrint" class="pp-do">🖨 开始打印</button>
      <button id="ppClose">✕ 关闭</button>
    </div>
  </div>
  <div class="pp-pages" id="ppPages"></div>
</div>

<script>
/* ============ 初始名单（空白：新访客打开为空任务，可自由新建；老用户数据存于浏览器本地不受影响） ============ */
const DEFAULT_DATA = [
  {name:"第1桌", people:[]}
];

/* 桌主题色 */
const THEME = ["#3b82f6","#16a34a","#f59e0b","#dc2626","#8b5cf6","#0891b2","#ec4899","#65a30d","#ea580c","#4f46e5","#0d9488","#9333ea"];

/* ============ 数据与持久化（多任务系统 v3） ============ */
const STORAGE_KEY = "wbd_seating_interactive_v3";
const LEGACY_KEYS = ["wbd_seating_interactive_v2","wbd_seating_interactive_v1","seating_v2","seating_v1"];
let nextId = 1000;
let tasks = [];
let curTask = null;
let data = [];   /* 始终指向当前任务 curTask.tables */

function freshTables(){
  const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
  d.forEach(t=>t.people.forEach(p=>{ p.id = nextId++; }));
  return d;
}
function mkTask(name, tables){
  return {
    id: "t" + Date.now() + "_" + Math.floor(Math.random()*10000),
    name: name || "未命名任务",
    tables: tables,
    initial: JSON.parse(JSON.stringify(tables)),
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
function loadTasks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const store = JSON.parse(raw);
      if(store && Array.isArray(store.tasks) && store.tasks.length){
        tasks = store.tasks;
        curTask = tasks.find(t=>t.id === store.currentTaskId) || tasks[0];
        curTask.tables = Array.isArray(curTask.tables) ? curTask.tables : [];
        if(!Array.isArray(curTask.initial)) curTask.initial = JSON.parse(JSON.stringify(curTask.tables));
        data = curTask.tables;
        resumeNextId();
        return;
      }
    }
  }catch(e){}
  /* 旧版本数据迁移：把 v2/v1 的名单包成第一个任务，用户已有数据不丢 */
  for(const k of LEGACY_KEYS){
    try{
      const raw = localStorage.getItem(k);
      if(!raw) continue;
      const d = JSON.parse(raw);
      if(Array.isArray(d) && d.length){
        const total = d.reduce((s,t)=>s + (t && Array.isArray(t.people) ? t.people.length : 0), 0);
        if(total > 0){
          d.forEach(t=>t.people.forEach(p=>{ if(typeof p.id !== "number") p.id = nextId++; }));
          tasks = [ mkTask("大家一起排排座", d) ];
          curTask = tasks[0];
          data = curTask.tables;
          saveTasks();
          return;
        }
      }
    }catch(e){}
  }
  tasks = [ mkTask("大家一起排排座", freshTables()) ];
  curTask = tasks[0];
  data = curTask.tables;
}
function resumeNextId(){
  let max = 999;
  tasks.forEach(t=>{
    (Array.isArray(t.tables) ? t.tables : []).forEach(tb=>{
      (Array.isArray(tb.people) ? tb.people : []).forEach(p=>{
        if(typeof p.id === "number" && p.id > max) max = p.id;
      });
    });
  });
  nextId = max + 1;
}
function saveTasks(){
  try{
    curTask.updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks: tasks, currentTaskId: curTask.id }));
  }catch(e){}
}
function saveData(){ saveTasks(); }

/* ============ 工具函数 ============ */
function $id(id){ return document.getElementById(id); }
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function findPerson(ti, pid){
  const t = data[ti];
  const idx = t ? t.people.findIndex(p=>p.id===pid) : -1;
  return { table: t, idx };
}
function nextTableName(){
  let max = 0;
  data.forEach(t=>{
    const m = String(t.name).match(/\d+/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "第" + (max+1) + "桌";
}

/* ============ 渲染 ============ */
function render(){
  const grid = $id("grid");
  grid.innerHTML = "";

  data.forEach((t, ti)=>{
    const accent = THEME[ti % THEME.length];
    const card = document.createElement("div");
    card.className = "table-card";
    card.dataset.table = ti;
    card.style.setProperty("--accent", accent);

    const head = document.createElement("div");
    head.className = "table-head";
    head.innerHTML =
      '<span class="table-name"></span>' +
      '<span class="table-count">'+t.people.length+'人</span>' +
      '<button class="del-table" title="删除整桌">✕</button>';
    head.querySelector(".table-name").textContent = t.name;
    head.querySelector(".del-table").addEventListener("click", ()=>delTable(ti));
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "table-body";

    const n = t.people.length;
    const rt = document.createElement("div");
    rt.className = "round-table";
    rt.innerHTML = '<div class="rt-title"></div><div class="rt-sub"></div>';
    rt.querySelector(".rt-title").textContent = t.name;
    rt.querySelector(".rt-sub").textContent = n + " 人";
    body.appendChild(rt);

    if(n === 0){
      const empty = document.createElement("div");
      empty.className = "empty-table";
      empty.innerHTML = '<span class="big">🪑</span><span>空桌 · 拖人进来或点「添加人员」</span>';
      body.appendChild(empty);
    }else{
      const cx = 250, cy = 190, R = 152;
      t.people.forEach((p, i)=>{
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const x = cx + R * Math.cos(angle);
        const y = cy + R * Math.sin(angle);
        const seat = document.createElement("div");
        seat.className = "seat";
        seat.dataset.id = p.id;
        seat.dataset.table = ti;
        seat.draggable = true;
        seat.style.left = x + "px";
        seat.style.top = y + "px";
        seat.innerHTML = '<span class="seat-name">' + escAttr(p.name) + "</span>";
        let stitle = p.name;
        if(p.gender) stitle += " · " + p.gender;
        if(p.rank) stitle += " · " + p.rank;
        seat.title = stitle;
        if(p.color){
          seat.style.background = p.color;
          seat.style.borderColor = p.color;
          seat.style.color = textColorFor(p.color);
          seat.style.boxShadow = "0 2px 6px rgba(0,0,0,.16)";
        }
        body.appendChild(seat);
      });
    }

    card.appendChild(body);
    grid.appendChild(card);
  });

  $id("statPeople").textContent = data.reduce((s,t)=>s+t.people.length,0);
  $id("statTables").textContent = data.length;
  renderSidebar();
  renderTaskBar();
}

/* ============ 左侧人员名单 ============ */
function findPersonGlobal(pid){
  for(let ti=0;ti<data.length;ti++){
    const idx = data[ti].people.findIndex(p=>p.id===pid);
    if(idx>=0) return { ti, idx };
  }
  return { ti:-1, idx:-1 };
}

function renderSidebar(){
  const list = $id("sbList");
  const kw = ($id("sbSearch").value || "").trim();
  list.innerHTML = "";
  let total = 0;
  data.forEach((t, ti)=>{
    total += t.people.length;
    const g = document.createElement("div");
    g.className = "sb-group";
    g.innerHTML =
      '<div class="sb-ghead">' +
        '<span class="sb-gname"></span>' +
        '<span class="sb-gcount"></span>' +
        '<button class="sb-gadd" data-ti="'+ti+'" title="加入此桌">➕</button>' +
      '</div>';
    g.querySelector(".sb-gname").textContent = t.name;
    g.querySelector(".sb-gcount").textContent = t.people.length + "人";
    const box = document.createElement("div");
    box.className = "sb-persons";
    if(t.people.length === 0 && !kw){
      box.innerHTML = '<div class="sb-gempty">空桌 · 点 ➕ 加人</div>';
    }else{
      const shown = t.people.filter(p=> !kw || p.name.includes(kw));
      if(shown.length === 0){
        box.innerHTML = '<div class="sb-gempty">无匹配</div>';
      }else{
        shown.forEach(p=>{
          const row = document.createElement("div");
          row.className = "sb-person";
          row.dataset.id = p.id;
          const gBadge = p.gender ? '<span class="sb-badge sb-gender '+(p.gender==='男'?'g-m':'g-f')+'">'+escAttr(p.gender)+'</span>' : '';
          const rBadge = p.rank ? '<span class="sb-badge sb-rank" title="职级">'+escAttr(p.rank)+'</span>' : '';
          row.innerHTML = '<span class="sb-dot" style="background:'+(p.color||'transparent')+'"></span><span class="sb-pname"></span>'+gBadge+rBadge+'<button class="sb-pdel" title="删除此人">✕</button>';
          row.querySelector(".sb-pname").textContent = p.name;
          box.appendChild(row);
        });
      }
    }
    g.appendChild(box);
    list.appendChild(g);
  });
  $id("sbCount").textContent = total + "人";
}

$id("sbSearch").addEventListener("input", renderSidebar);

$id("sbList").addEventListener("click", (e)=>{
  const delBtn = e.target.closest(".sb-pdel");
  if(delBtn){
    const row = delBtn.closest(".sb-person");
    const fp = findPersonGlobal(parseInt(row.dataset.id,10));
    if(fp.idx < 0) return;
    const pname = data[fp.ti].people[fp.idx].name;
    confirmDialog("删除人员", "确定删除「"+pname+"」？", "删除", ()=>{
      data[fp.ti].people.splice(fp.idx,1);
      saveData(); render();
    });
    return;
  }
  const addBtn = e.target.closest(".sb-gadd");
  if(addBtn) showAddPersonModal(parseInt(addBtn.dataset.ti,10));
});

$id("btnSbAdd").addEventListener("click", ()=> showAddPersonModal());

/* ============ 拖拽逻辑 ============ */
let dragId = null, dragFrom = null;

document.addEventListener("dragstart", (e)=>{
  const seat = e.target.closest(".seat");
  if(!seat) return;
  dragId = parseInt(seat.dataset.id,10);
  dragFrom = parseInt(seat.dataset.table,10);
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(dragId));
  seat.classList.add("dragging");
});

document.addEventListener("dragend", ()=>{
  clearDrag();
});

document.addEventListener("dragover", (e)=>{
  if(dragId === null) return;
  const card = e.target.closest(".table-card");
  if(!card) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".seat.drag-over").forEach(s=>s.classList.remove("drag-over"));
  const seat = e.target.closest(".seat");
  if(seat) seat.classList.add("drag-over");
});

document.addEventListener("drop", (e)=>{
  if(dragId === null) return;
  const card = e.target.closest(".table-card");
  if(card){
    e.preventDefault();
    const toTable = parseInt(card.dataset.table,10);
    const seat = e.target.closest(".seat");
    if(seat){
      swapPersons(dragFrom, dragId, toTable, parseInt(seat.dataset.id,10));
    }else{
      moveToEnd(dragFrom, dragId, toTable);
    }
    saveData();
    render();
  }
  clearDrag();
});

function clearDrag(){
  document.querySelectorAll(".seat").forEach(s=>s.classList.remove("dragging","drag-over"));
  dragId = null; dragFrom = null;
}

function swapPersons(fromTi, idA, toTi, idB){
  const a = findPerson(fromTi, idA);
  const b = findPerson(toTi, idB);
  if(a.idx < 0 || b.idx < 0) return;
  if(fromTi === toTi){
    const tmp = data[fromTi].people[a.idx];
    data[fromTi].people[a.idx] = data[fromTi].people[b.idx];
    data[fromTi].people[b.idx] = tmp;
  }else{
    const pa = data[fromTi].people.splice(a.idx,1)[0];
    const pb = data[toTi].people.splice(b.idx,1)[0];
    data[fromTi].people.splice(a.idx,0,pb);
    data[toTi].people.splice(b.idx,0,pa);
  }
}
function moveToEnd(fromTi, idA, toTi){
  const a = findPerson(fromTi, idA);
  if(a.idx < 0) return;
  const p = data[fromTi].people.splice(a.idx,1)[0];
  data[toTi].people.push(p);
}

/* ============ 点击/右键菜单 ============ */
const menu = $id("menu");
let menuCtx = null;

function showMenu(x, y, ti, pid){
  const p = findPerson(ti, pid);
  if(p.idx < 0) return;
  menuCtx = { ti, pid };
  menu.innerHTML =
    '<div class="menu-item" data-act="insert">➕ 在此人后加人</div>' +
    '<div class="menu-item" data-act="color">🎨 填充颜色</div>' +
    '<div class="menu-item danger" data-act="del">🗑 删除此人</div>';
  menu.classList.remove("hidden");
  const mw = 170, mh = 196;
  menu.style.left = Math.min(x, window.innerWidth - mw - 8) + "px";
  menu.style.top  = Math.min(y, window.innerHeight - mh - 8) + "px";
}

menu.addEventListener("click", (e)=>{
  const item = e.target.closest(".menu-item");
  if(!item || !menuCtx) return;
  const act = item.dataset.act;
  const { ti, pid } = menuCtx;
  const p = findPerson(ti, pid);
  menu.classList.add("hidden");

  if(act === "insert"){
    openModal("在此人后加人",
      '<label>名字（可多个，用逗号/顿号/空格分隔）</label>' +
      '<textarea id="mpNames" rows="3" placeholder="例如：张三、李四"></textarea>' +
      '<label>性别（可选）</label>' +
      '<select id="mpGender"><option value="">不限</option><option value="男">男</option><option value="女">女</option></select>' +
      '<label>职级（可选）</label>' +
      '<input type="text" id="mpRank" placeholder="如：经理 / P7">',
      ()=>{
        const names = parseNames($id("mpNames").value);
        if(!names.length){ showModalError("请至少输入一个名字"); return false; }
        const gender = $id("mpGender").value;
        const rank = ($id("mpRank").value || "").trim();
        const idx = findPerson(ti, pid).idx;
        if(idx >= 0){
          names.forEach((nm, k)=>{
            const person = { id: nextId++, name: nm };
            if(gender) person.gender = gender;
            if(rank) person.rank = rank;
            data[ti].people.splice(idx+1+k, 0, person);
          });
        }
        saveData(); render();
        return true;
      });
  }else if(act === "color"){
    showColorPickerModal(ti, pid);
  }else if(act === "del"){
    if(p.idx >= 0){
      const pname = p.table.people[p.idx].name;
      confirmDialog("删除人员", "确定删除「"+pname+"」？", "删除", ()=>{
        p.table.people.splice(p.idx,1);
        saveData(); render();
      });
    }
  }
});

document.addEventListener("click", (e)=>{
  if(!menu.classList.contains("hidden") && !menu.contains(e.target)){
    menu.classList.add("hidden");
  }
  const seat = e.target.closest(".seat");
  if(!seat) return;
  const ti = parseInt(seat.dataset.table,10);
  const pid = parseInt(seat.dataset.id,10);
  showMenu(e.clientX, e.clientY, ti, pid);
});

document.addEventListener("contextmenu", (e)=>{
  const seat = e.target.closest(".seat");
  if(!seat) return;
  e.preventDefault();
  const ti = parseInt(seat.dataset.table,10);
  const pid = parseInt(seat.dataset.id,10);
  showMenu(e.clientX, e.clientY, ti, pid);
});

/* ============ 弹窗 ============ */
const overlay = $id("modalOverlay");
const modal = $id("modal");
let modalOk = null;

function openModal(title, bodyHTML, onOk, okText){
  modalOk = onOk;
  modal.innerHTML =
    '<h3>'+title+'</h3>' +
    bodyHTML +
    '<div class="modal-btns">' +
      '<button class="cancel">取消</button>' +
      '<button class="ok">'+(okText||"确定")+'</button>' +
    '</div>';
  overlay.classList.remove("hidden");
  const ta = modal.querySelector("textarea, input");
  if(ta) setTimeout(()=>ta.focus(), 30);
}
function confirmDialog(title, msg, okText, onOk){
  openModal(title, '<p class="m-msg">'+msg+'</p>', onOk, okText);
}
function showModalError(msg){
  let err = modal.querySelector(".m-error");
  if(!err){
    err = document.createElement("div");
    err.className = "m-error";
    const h3 = modal.querySelector("h3");
    h3.parentNode.insertBefore(err, h3.nextSibling);
  }
  err.textContent = msg;
}
function closeModal(){ overlay.classList.add("hidden"); modalOk = null; }
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
modal.addEventListener("click", (e)=>{
  if(e.target.closest(".cancel")) closeModal();
  else if(e.target.closest(".ok")){
    if(modalOk){ const ok = modalOk(); if(ok !== false) closeModal(); }
  }
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && !overlay.classList.contains("hidden")) closeModal();
});

function parseNames(str){
  return str.split(/[,，、;；\s\n]+/).map(s=>s.trim()).filter(Boolean);
}

/* ============ 姓名框填充颜色 ============ */
const COLOR_PALETTE = [
  "#ef4444","#f97316","#f59e0b","#facc15",
  "#84cc16","#22c55e","#10b981","#14b8a6",
  "#06b6d4","#0ea5e9","#3b82f6","#6366f1",
  "#8b5cf6","#a855f7","#d946ef","#ec4899",
  "#f43f5e","#fb7185","#94a3b8","#64748b",
  "#475569","#334155","#1e293b","#0f172a"
];
/* 根据背景亮度自动选择深色/浅色文字（浅底深字、深底白字） */
function textColorFor(bg){
  const h = String(bg||"").replace("#","");
  if(!h) return "#374151";
  let r, g, b;
  if(h.length === 3){ r = parseInt(h[0],16)*17; g = parseInt(h[1],16)*17; b = parseInt(h[2],16)*17; }
  else if(h.length === 6){ r = parseInt(h.substr(0,2),16); g = parseInt(h.substr(2,2),16); b = parseInt(h.substr(4,2),16); }
  else return "#374151";
  return (r*299 + g*587 + b*114) > 125000 ? "#1f2937" : "#ffffff";
}
function applyPersonColor(ti, pid, color){
  const p = findPerson(ti, pid);
  if(p.idx < 0) return;
  if(color) p.table.people[p.idx].color = color;
  else delete p.table.people[p.idx].color;
  saveData(); render();
}
function showColorPickerModal(ti, pid){
  const p = findPerson(ti, pid);
  if(p.idx < 0) return;
  const cur = p.table.people[p.idx].color || "";
  let sw = '<div class="color-swatch none'+(cur?"":" on")+'" data-color="" title="默认（无填充）">✕</div>';
  COLOR_PALETTE.forEach(c=>{
    sw += '<div class="color-swatch'+(c.toLowerCase()===cur.toLowerCase()?" on":"")+'" data-color="'+c+'" style="background:'+c+'" title="'+c+'"></div>';
  });
  openModal("🎨 填充颜色",
    '<div class="color-grid">' + sw + '</div>' +
    '<div class="color-custom"><label>自定义</label><input type="color" id="customColor" value="'+(cur||"#3b82f6")+'"></div>' +
    '<div class="color-tip">点击色块立即填充 · ✕ 恢复默认白色 · 侧栏名单同步显示色点</div>',
    null, "关闭");
  modal.querySelectorAll(".color-swatch").forEach(el=>{
    el.addEventListener("click", ()=>{
      applyPersonColor(ti, pid, el.dataset.color || null);
      closeModal();
    });
  });
  modal.querySelector("#customColor").addEventListener("input", (e)=>{
    applyPersonColor(ti, pid, e.target.value);
  });
}

/* ============ 多任务系统（新建 / 历史任务 / 切换） ============ */
function renderTaskBar(){
  const sel = $id("taskSel");
  if(!sel) return;
  sel.innerHTML = "";
  tasks.forEach(t=>{
    const st = taskStats(t);
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = (t.id === curTask.id ? "● " : "") + t.name + "（" + st.n + "人 · " + st.m + "桌）";
    if(t.id === curTask.id) opt.selected = true;
    sel.appendChild(opt);
  });
  const tn = $id("statTaskName");
  if(tn) tn.textContent = curTask ? curTask.name : "";
  syncMainTitle();
}
/* ============ 标题点击编辑 ============ */
function syncMainTitle(){
  const t = $id("mainTitle");
  if(t && curTask) t.textContent = curTask.name;
}
function saveMainTitle(){
  const t = $id("mainTitle");
  if(!t || !curTask) return;
  let nm = t.textContent.replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  if(!nm || Array.from(nm).length > 30) nm = curTask.name;   /* 空标题或超30字恢复原样 */
  if(nm === curTask.name){ syncMainTitle(); return; }
  curTask.name = nm;
  saveTasks();
  renderTaskBar();
  const pt = $id("ppPageTitle");
  if(pt) pt.textContent = curTask.name;
}
(function(){
  const t = $id("mainTitle");
  if(!t) return;
  t.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); t.blur(); }      /* 回车保存并退出编辑 */
    if(e.key === "Escape"){ syncMainTitle(); t.blur(); }        /* Esc 取消编辑 */
  });
  t.addEventListener("input", ()=>{
    if(Array.from(t.textContent).length > 30){
      t.textContent = Array.from(t.textContent).slice(0,30).join("");
      const r = document.createRange();
      r.selectNodeContents(t);
      r.collapse(false);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  });
  t.addEventListener("blur", saveMainTitle);
  t.addEventListener("paste", e=>{
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData("text");
    if(txt) document.execCommand("insertText", false, txt.replace(/\s+/g," "));
  });
})();
function taskStats(t){

    m: tabs.length

function ensureXLSX(cb){
  if(typeof XLSX !== "undefined"){ cb(); return; }
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
  s.onload = cb;
  s.onerror = ()=>{ showModalError("Excel 解析库加载失败（需要联网）。可改用 CSV 文件导入。"); };
  document.head.appendChild(s);
}
function readFileAsBuffer(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result);
    fr.onerror = rej;
    fr.readAsArrayBuffer(file);
  });
}
function decodeCSVText(buf){
  try{ return new TextDecoder("utf-8", {fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder("gbk").decode(buf); }catch(e2){ return new TextDecoder("utf-8").decode(buf); } }
}
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], cur = "", inQ = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }else{
      if(ch === '"') inQ = true;
      else if(ch === ","){ row.push(cur); cur = ""; }
      else if(ch === "\n" || ch === "\r"){
        if(ch === "\r" && text[i+1] === "\n") i++;
        row.push(cur); cur = "";
        if(row.some(c=>String(c).trim()!=="")) rows.push(row);
        row = [];
      }
      else cur += ch;
    }
  }
  if(cur !== "" || row.length){ row.push(cur); if(row.some(c=>String(c).trim()!=="")) rows.push(row); }
  return rows;
}
function isHeaderRow(r){
  if(!r || !r.length) return false;
  const v = String(r[0]).trim().toLowerCase();
  return ["姓名","名字","name","人员","嘉宾","宾客"].includes(v);
}
function cnToNum(s){
  const map = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  if(s === "十") return 10;
  if(s.length === 1) return map[s] || 1;
  if(s[0] === "十") return 10 + (map[s[1]] || 0);
  if(s[s.length-1] === "十") return (map[s[0]] || 1) * 10;
  return 1;
}
function normalizeTableName(raw){
  const v = String(raw || "").trim().replace(/\s+/g,"");
  if(!v) return "";
  const m = v.match(/(\d+|[一二三四五六七八九十]+)/);
  if(m){
    const num = /^\d+$/.test(m[1]) ? parseInt(m[1],10) : cnToNum(m[1]);
    return "第" + num + "桌";
  }
  return v;
}
function normalizeGender(s){
  const v = String(s || "").trim();
  if(!v) return "";
  const low = v.toLowerCase();
  if(v === "男" || low === "m" || low === "male" || v === "先生") return "男";
  if(v === "女" || low === "f" || low === "female" || v === "女士" || v === "小姐") return "女";
  return v;
}
function buildTablesFromRows(rows){
  const tables = [];
  const map = new Map();
  let newCount = 0;
  rows.forEach(r=>{
    if(!Array.isArray(r) || !r.length) return;
    const name = String(r[0] || "").trim();
    if(!name) return;
    let tname = normalizeTableName(r[1]);
    if(!tname){ newCount++; tname = "新桌" + newCount; }
    let ti = map.get(tname);
    if(ti === undefined){
      tables.push({ name: tname, people: [] });
      ti = tables.length - 1;
      map.set(tname, ti);
    }
    const person = { id: nextId++, name };
    const gender = normalizeGender(r[2]);
    const rank = String(r[3] || "").trim();
    if(gender) person.gender = gender;
    if(rank) person.rank = rank;
    tables[ti].people.push(person);
  });
  return tables;
}
function applyImport(tables, mode){
  if(!tables.length){ showModalError("未识别到任何姓名，请检查文件：第 1 列应为姓名"); return; }
  const imported = tables.reduce((s,t)=>s+t.people.length,0);
  if(mode === "replace"){
    curTask.tables = tables;
    data = tables;
    curTask.initial = JSON.parse(JSON.stringify(tables));
  }else{
    tables.forEach(t=>data.push(t));
  }
  saveData(); render(); closeModal();
  confirmDialog("导入成功",
    '已导入 <b>'+imported+'</b> 人' +
    (mode === "replace" ? '，替换为 <b>'+data.length+'</b> 桌。' : '，新增 <b>'+tables.length+'</b> 桌，当前共 <b>'+data.length+'</b> 桌。'),
    "知道了", ()=>{});
}
function doImport(){
  const file = $id("mpFile").files[0];
  if(!file){ showModalError("请先选择文件"); return false; }
  const mode = $id("mpMode").value;
  const ext = file.name.split(".").pop().toLowerCase();
  if(ext === "csv"){
    readFileAsBuffer(file).then(buf=>{
      const rows = parseCSV(decodeCSVText(buf));
      if(isHeaderRow(rows[0])) rows.shift();
      applyImport(buildTablesFromRows(rows), mode);
    }).catch(()=>showModalError("文件读取失败"));
  }else{
    ensureXLSX(()=>{
      readFileAsBuffer(file).then(buf=>{
        const wb = XLSX.read(buf, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        if(isHeaderRow(rows[0])) rows.shift();
        applyImport(buildTablesFromRows(rows), mode);
      }).catch(()=>showModalError("文件解析失败，请确认是有效的 Excel 文件"));
    });
  }
  return false;
}

/* 计算"自动"模式的缩放：把所有桌塞进一页（纸面约 700×990，内容区减去内边距；横向则翻转） */
function calcAutoZoom(orient){
  const n = data.length;
  if(n <= 0) return 1;
  const landscape = orient === "landscape";
  const availW = landscape ? 954 : 664;   // 横向 990-36 / 纵向 700-36
  const availH = landscape ? 664 : 954;   // 横向 700-36 / 纵向 990-36
  const cardW = 500, cardH = 470, gap = 12;
  /* 按面积估算每行列数，让整体接近正方形排布 */
  let best = { cols:1, rows:n, zoom:0 };
  const maxCols = Math.min(n, landscape ? 6 : 4);
  for(let cols=1; cols<=maxCols; cols++){
    const rows = Math.ceil(n / cols);
    const z = Math.min((availW - gap*(cols-1)) / (cardW*cols), (availH - gap*(rows-1)) / (cardH*rows));
    const zc = Math.min(1, z);
    if(zc > best.zoom){ best = { cols, rows, zoom:zc }; }
  }
  return Math.round(best.zoom * 100 / 5) * 5;  /* 取整到 5% */
}

function renderPrintPreview(){
  const perPage = parseInt($id("ppPerPage").value,10);
  const orient = $id("ppOrient").value;
  const pages = $id("ppPages");
  pages.innerHTML = "";

  /* 克隆当前桌卡 DOM 用于预览 */
  const cards = Array.from(document.querySelectorAll("#grid .table-card")).map(c=>c.cloneNode(true));
  let zoom = parseInt($id("ppZoom").value,10);
  if(perPage === 0 && !ppZoomTouched){
    zoom = calcAutoZoom(orient);
    $id("ppZoom").value = zoom;
  }
  $id("ppZoomVal").textContent = zoom + "%";

  if(cards.length === 0){
    pages.innerHTML = '<div style="color:#fff;text-align:center;padding:40px;font-size:14px;">暂无桌子，无法预览</div>';
    return;
  }

  const groups = [];
  if(perPage === 0){
    groups.push(cards);
  }else{
    for(let i=0;i<cards.length;i+=perPage){
      groups.push(cards.slice(i, i+perPage));
    }
  }

  groups.forEach((g, gi)=>{
    const page = document.createElement("div");
    page.className = "pp-page" + (orient === "landscape" ? " landscape" : "");
    const titleEl = document.createElement("div");
    titleEl.className = "pp-pg-title";
    titleEl.id = "ppPageTitle";
    titleEl.textContent = curTask ? curTask.name : "";
    page.appendChild(titleEl);
    const inner = document.createElement("div");
    inner.className = "pp-inner";
    inner.style.zoom = zoom / 100;
    g.forEach(c=>{
      const del = c.querySelector(".del-table");
      if(del) del.remove();
      inner.appendChild(c);
    });
    page.appendChild(inner);
    const num = document.createElement("div");
    num.className = "pp-page-num";
    num.textContent = "第 " + (gi+1) + " 页 · " + g.length + " 桌";
    page.appendChild(num);
    pages.appendChild(page);
  });
}

function delTable(ti){
  const t = data[ti];
  const msg = t.people.length
    ? "「"+t.name+"」还有 "+t.people.length+" 人，确定删除整桌？"
    : "确定删除空桌「"+t.name+"」？";
  confirmDialog("删除桌子", msg, "删除", ()=>{
    data.splice(ti,1);
    saveData(); render();
  });
}

/* ============ 启动 ============ */
loadUIPrefs();
applyNameSize();
applyZoom();
$id("grid").classList.add("fixed2");   /* 布局固定为每行 2 桌 */
document.body.classList.add(uiPrefs.printPerPage === 0 ? "pp-auto" : "pp-" + uiPrefs.printPerPage);
document.body.style.setProperty("--print-zoom", (uiPrefs.printZoom/100).toFixed(2));
applyPrintOrient(uiPrefs.printOrient);
loadTasks();
loadFromHash();
applyNameSize();
applyZoom();
renderTaskBar();
render();
</script>
</body>
</html>
